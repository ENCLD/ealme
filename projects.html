<!DOCTYPE html>
<html lang="no">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prosjekter</title>
    <link rel="stylesheet" href="site.css">

    <style>
        /* Container alignment for language switchers */
        .controls {
            display: inline-flex;
            gap: 6px;
            background-color: #f1f3f5;
            padding: 4px;
            border-radius: 30px; /* Outer rounded track */
        }

            /* Standard round button style rules */
            .controls button {
                background: transparent;
                color: #495057;
                border: none;
                padding: 6px 14px;
                font-size: 13px;
                font-weight: 600;
                font-family: inherit;
                cursor: pointer;
                border-radius: 20px; /* Pill-shaped round design */
                transition: all 0.2s ease-in-out;
            }

                /* Hover animation properties */
                .controls button:hover {
                    color: #1a1a1a;
                }

                /* Active highlight status styling profile */
                .controls button.active {
                    background-color: #ffffff;
                    color: #000000;
                    box-shadow: 0px 2px 6px rgba(0, 0, 0, 0.1);
                }
    </style>
</head>

<body>

    <nav class="top-menu">
        <div class="nav-inner">
            <a href="index.html" class="logo">ealme</a>

            <!-- This will hide/show based on your site.css mobile setup -->
            <div class="nav-links" id="navMenu">
                <a href="index.html" data-i18n="nav-dagbok">Dagbok</a>
                <a href="projects.html" class="active" data-i18n="nav-prosjekt">Prosjekter</a>
            </div>

            <!-- Container for buttons -->
            <div class="controls-wrapper" style="display: flex; align-items: center; gap: 10px;">
                <!-- Styled Pill Container Switch -->
                <div class="controls">
                    <button id="btn-no" class="active" onclick="setLanguage('no')">Norsk</button>
                    <button id="btn-en" onclick="setLanguage('en')">English</button>
                </div>

                <!-- Burger button sits beautifully on the side -->
                <button class="burger-btn" id="burgerBtn" aria-label="Toggle navigation">
                    <span class="bar"></span>
                    <span class="bar"></span>
                    <span class="bar"></span>
                </button>
            </div>
        </div>
    </nav>


    <main class="container">

        <header class="page-header">
            <p class="eyebrow" data-i18n="header-eyebrow">Dokumentasjon</p>
            <h1 data-i18n="header-title">Prosjekter</h1>
        </header>


        <section class="projects">

            <article class="project-card">
                <div class="project-header">
                    <span class="project-name">ealme-web</span>
                </div>
                <p data-i18n="project-web-ealme">
                    Vi har bygget en nettside
                </p>
            </article>

        </section>

    </main>

    <script>
        // JavaScript only needs the English data
        const translations = {
            en: {
                "nav-dagbok": "Diary",
                "nav-prosjekt": "Projects",
                "header-eyebrow": "Documentation",
                "header-title": "Projects",
                "project-web-ealme": "We built a website"
            }
        };

        function setLanguage(lang) {
            document.documentElement.lang = lang;
            const elements = document.querySelectorAll('[data-i18n]');

            elements.forEach(element => {
                const key = element.getAttribute('data-i18n');

                // 1. If it's the first time running, save whatever original Norwegian is written in the HTML markup
                if (!element.hasAttribute('data-original-no')) {
                    element.setAttribute('data-original-no', element.textContent.trim());
                }

                // 2. Route text values based on language choice
                if (lang === 'en' && translations.en[key]) {
                    element.textContent = translations.en[key];
                } else {
                    // Fall back cleanly to the original saved Norwegian text
                    element.textContent = element.getAttribute('data-original-no');
                }
            });

            document.getElementById('btn-no').classList.toggle('active', lang === 'no');
            document.getElementById('btn-en').classList.toggle('active', lang === 'en');

            localStorage.setItem('diaryLanguage', lang);
        }

        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('diaryLanguage') || 'no';
            setLanguage(savedLang);
        });

        // DOM Interaction logic for Mobile Burger actions
        window.addEventListener('DOMContentLoaded', () => {
            const savedLang = localStorage.getItem('diaryLanguage') || 'no';
            setLanguage(savedLang);

            const burgerBtn = document.getElementById('burgerBtn');
            const navMenu = document.getElementById('navMenu');
            const menuLinks = document.querySelectorAll('.nav-links a');

            if (burgerBtn && navMenu) {
                // Toggle view configurations when clicked
                burgerBtn.addEventListener('click', () => {
                    burgerBtn.classList.toggle('active');
                    navMenu.classList.toggle('active');
                });

                // Automatically fold up menu when hitting internal links
                menuLinks.forEach(link => {
                    link.addEventListener('click', () => {
                        burgerBtn.classList.remove('active');
                        navMenu.classList.remove('active');
                    });
                });
            }
        });
    </script>

</body>
</html>
